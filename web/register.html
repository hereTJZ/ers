<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>实验预约系统-注册</title>
        <!-- 引入字体图标 -->
        <link href="css/font-awesome-4.7.0/css/font-awesome.min.css" rel="stylesheet" />
        <script src="js/jquery-3.6.0.min.js"></script>
        <style type="text/css">
            body {
                size: 100%;
                margin: 0;
                /* 100%窗口高度 */
                height: 100vh;
                /* 弹性布局 居中 */
                display: flex;
                justify-content: center;
                align-items: center;
                /* 渐变背景 */
                background: linear-gradient(200deg, #72afd3, #96fbc4);
            }

            .regist-box {
                /* 相对定位 */
                position: relative;
                height: 480px;
                width: 360px;
                background-color: rgb(255, 255, 255);
                border-radius: 8px;
            }

            .account {
                position: absolute;
                top: 100px;
                left: 46px;
                background-color: rgb(238, 238, 238);
                width: 265px;
                height: 36px;
                border-radius: 20px;
            }

            .verification {
                position: absolute;
                top: 150px;
                left: 46px;
                background-color: rgb(238, 238, 238);
                width: 180px;
                height: 36px;
                border-radius: 20px;
            }

            .password {
                position: absolute;
                top: 200px;
                left: 46px;
                background-color: rgb(238, 238, 238);
                width: 265px;
                height: 36px;
                border-radius: 20px;
            }

            .realname {
                position: absolute;
                top: 250px;
                left: 46px;
                background-color: rgb(238, 238, 238);
                width: 265px;
                height: 36px;
                border-radius: 20px;
            }

            .email {
                position: absolute;
                top: 300px;
                left: 46px;
                background-color: rgb(238, 238, 238);
                width: 265px;
                height: 36px;
                border-radius: 20px;
            }

            #account:focus,
            #verification-code:focus,
            #password:focus,
            #email,
            #realname,
            button:focus {
                outline: 0;
            }

            button {
                cursor: pointer;
            }

            .submit-button {
                position: absolute;
                bottom: 70px;
                left: 58px;
            }

            /* 猫头鹰的样式 */
            .owl {
                width: 211px;
                height: 108px;
                /* 背景图片 */
                background: url("img/owl.png") no-repeat;
                /* 绝对定位 */
                position: absolute;
                top: -100px;
                /* 水平居中 */
                left: 50%;
                transform: translateX(-50%);
            }
            .owl .hand {
                width: 34px;
                height: 34px;
                border-radius: 40px;
                background-color: #472d20;
                /* 绝对定位 */
                position: absolute;
                left: 12px;
                bottom: -8px;
                /* 沿Y轴缩放0.6倍（压扁） */
                transform: scaleY(0.6);
                /* 动画过渡 */
                transition: 0.3s ease-out;
            }
            .owl .hand.hand-r {
                left: 170px;
            }
            .owl.password .hand {
                transform: translateX(42px) translateY(-15px) scale(0.7);
            }
            .owl.password .hand.hand-r {
                transform: translateX(-42px) translateY(-15px) scale(0.7);
            }
            .owl .arms {
                position: absolute;
                top: 58px;
                width: 100%;
                height: 41px;
                overflow: hidden;
            }
            .owl .arms .arm {
                width: 40px;
                height: 65px;
                position: absolute;
                left: 20px;
                top: 40px;
                background: url("img/owl-arm.png") no-repeat;
                transform: rotate(-20deg);
                transition: 0.3s ease-out;
            }
            .owl .arms .arm.arm-r {
                transform: rotate(20deg) scaleX(-1);
                left: 158px;
            }
            .owl.password .arms .arm {
                transform: translateY(-40px) translateX(40px);
            }
            .owl.password .arms .arm.arm-r {
                transform: translateY(-40px) translateX(-40px) scaleX(-1);
            }

            /* 跟踪纸飞机 */
            #plane {
                color: #fff;
                font-size: 60px;
                /* 绝对定位 */
                position: absolute;
                /* 弹性布局 水平+垂直居中 */
                display: flex;
                justify-content: center;
                align-items: center;
            }

            /* 背景地球 */
            #background-img{
                /* left: 100px; */
                opacity: 1;
                width: 950px;
                height: 700px;
                filter: brightness(115%);
                position: absolute;
            }
        </style>
    </head>

    <body>

        <img id="background-img" src="img/earth.png" >
        <!-- 纸飞机 -->
        <div id="plane">
            <i class="fa fa-paper-plane" aria-hidden="true"></i>
        </div>

        <!-- 注册窗体 -->
        <div class="regist-box">
            <div class="owl" id="owl">
                <div class="hand"></div>
                <div class="hand hand-r"></div>
                <div class="arms">
                    <div class="arm"></div>
                    <div class="arm arm-r"></div>
                </div>
            </div>
            <!-- 注册表单 -->
            <form action="" method="post">
                <div style="position: absolute; right: 120px; top: 35px; font-size: 36px; color: rgb(214, 97, 97)">
                    <b>Sign up</b>
                </div>
                <!-- 账号 -->
                <div class="account">
                    <label style="position: absolute; left: 13px; top: 8px; font-size: 14px">账号</label>
                    <input
                        type="text"
                        name="account"
                        id="account"
                        value=""
                        placeholder="手机号码"
                        style="height: 34px; width: 200px; position: absolute; left: 65px; border: transparent; background-color: rgb(0, 0, 0, 0)"
                    />
                </div>
                <!-- 手机验证码 -->
                <div class="verification">
                    <label style="position: absolute; left: 13px; top: 8px; font-size: 14px">验证码</label>
                    <input
                        type="text"
                        name="verification-code"
                        id="verification-code"
                        value=""
                        placeholder="验证码"
                        style="height: 34px; width: 210px; position: absolute; left: 65px; border: transparent; background-color: rgb(0, 0, 0, 0)"
                    />
                    <button
                        type="button"
                        onclick="send_SMS()"
                        style="
                            position: absolute;
                            background: linear-gradient(200deg, #72afd3, #96fbc4);
                            border: transparent;
                            left: 195px;
                            top: 3px;
                            color: white;
                            height: 30px;
                            width: 70px;
                            border-radius: 20px;
                        "
                    >
                        发 送
                    </button>
                </div>
                <!-- 密码 -->
                <div class="password">
                    <label style="position: absolute; left: 13px; top: 8px; font-size: 14px">密码</label>
                    <input
                        type="password"
                        name="password"
                        id="password"
                        value=""
                        placeholder="请输入密码"
                        style="height: 34px; width: 200px; position: absolute; left: 65px; border: transparent; background-color: rgb(0, 0, 0, 0)"
                    />
                </div>
                <!-- 真实姓名 -->
                <div class="realname">
                    <label style="position: absolute; left: 13px; top: 8px; font-size: 14px">姓名</label>
                    <input
                        type="text"
                        name="realname"
                        id="realname"
                        value=""
                        placeholder="真实姓名"
                        style="height: 34px; width: 200px; position: absolute; left: 65px; border: transparent; background-color: rgb(0, 0, 0, 0)"
                    />
                </div>
                <!-- 邮箱 -->
                <div class="email">
                    <label style="position: absolute; left: 13px; top: 8px; font-size: 14px">邮箱</label>
                    <input
                        type="text"
                        name="email"
                        id="email"
                        value=""
                        placeholder="邮箱"
                        style="height: 34px; width: 200px; position: absolute; left: 65px; border: transparent; background-color: rgb(0, 0, 0, 0)"
                    />
                </div>
                <!-- 注册提示 -->
                <div style="position: absolute; right: 53px; bottom: 120px; font-size: 11px; color: rgb(243, 26, 26)">仅支持社会人员自主注册</div>
                <!-- 确认按钮 -->
                <div class="submit-button">
                    <button type="submit" style="background: linear-gradient(200deg, #72afd3, #96fbc4); border: transparent; color: white; height: 36px; width: 240px; border-radius: 20px">
                        注 册
                    </button>
                </div>
                <!-- 跳转登录 -->
                <div style="position: absolute; right: 128px; bottom: 40px">
                    <a style="font-size: 12px; color: rgb(104, 25, 25)" href="http://127.0.0.1:8848/login.html">已有账号，现在去登录</a>
                </div>
            </form>
        </div>
    </body>

    <script type="text/javascript">
        //  jQuery 函数位于 document ready 函数中，防止文档在完全加载（就绪）之前运行 jQuery 代码
        $(document).ready(function () {
            $("#password")
                .focus(function () {
                    // 密码框获得焦点，追加样式.password
                    $("#owl").addClass("password");
                })
                .blur(function () {
                    // 密码框失去焦点，移除样式.password
                    $("#owl").removeClass("password");
                });
        });

        // 纸飞机动画
        let plane = document.getElementById("plane");
        let deg = 0,
            ex = 0,
            ey = 0,
            vx = 0,
            vy = 0,
            count = 0;
        window.addEventListener("mousemove", (e) => {
            ex = e.x - plane.offsetLeft - plane.clientWidth / 2;
            ey = e.y - plane.offsetTop - plane.clientHeight / 2;
            deg = (360 * Math.atan(ey / ex)) / (2 * Math.PI) + 45;
            if (ex < 0) {
                deg += 180;
            }
            count = 0;
        });
        function draw() {
            plane.style.transform = "rotate(" + deg + "deg)";
            if (count < 100) {
                vx += ex / 100;
                vy += ey / 100;
            }
            plane.style.left = vx + "px";
            plane.style.top = vy + "px";
            count++;
        }
        setInterval(draw, 1);

        function send_SMS() {
            alert("短信已发送，请注意查收！");
        }
    </script>
</html>
